[project]
name = "hr_ai_agents"
authors = [{ name = "ERPion", email = "pranav@erpion.in" }]
description = "Optional, role-based AI agents for the Vodafone HRMS flow (ATS, SLA reminders, daily EOD report, anomaly review) with full audit logging."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
hrms = ">=15.0.0,<16.0.0"
